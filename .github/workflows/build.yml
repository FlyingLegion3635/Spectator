name: Build All Platforms

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel'
        required: true
        type: choice
        options:
          - Release
          - Beta
      version:
        description: 'Version (e.g. 1.0.0)'
        required: true
        type: string

env:
  FLUTTER_VERSION: '3.38.9'

jobs:
  # Android
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set short commit SHA
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}

      - name: Rename artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk "Spectator_Android_${{ env.SHORT_SHA }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Spectator_Android_${{ env.SHORT_SHA }}
          path: Spectator_Android_${{ env.SHORT_SHA }}.apk

  # Linux — individual packages per distro family
  build-linux-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set short commit SHA
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - run: flutter pub get
      - run: flutter build linux --release --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}

      - name: Create .deb package
        run: |
          PKG_ROOT=$(mktemp -d)
          mkdir -p "$PKG_ROOT/DEBIAN"
          mkdir -p "$PKG_ROOT/usr/local/bin"
          mkdir -p "$PKG_ROOT/usr/local/lib/spectator"
          mkdir -p "$PKG_ROOT/usr/share/applications"

          cp -r build/linux/x64/release/bundle/* "$PKG_ROOT/usr/local/lib/spectator/"

          cat > "$PKG_ROOT/usr/local/bin/spectator" << 'LAUNCHER'
          #!/bin/bash
          exec /usr/local/lib/spectator/spectator "$@"
          LAUNCHER
          chmod +x "$PKG_ROOT/usr/local/bin/spectator"

          cat > "$PKG_ROOT/usr/share/applications/spectator.desktop" << 'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Spectator
          Exec=/usr/local/bin/spectator
          Icon=spectator
          Categories=Utility;
          DESKTOP

          cat > "$PKG_ROOT/DEBIAN/control" << CTRL
          Package: spectator
          Version: 1.0.0
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: libgtk-3-0
          Maintainer: Spectator Team
          Description: Spectator application
          CTRL

          dpkg-deb --build "$PKG_ROOT" "Spectator_deb_Linux_${{ env.SHORT_SHA }}.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: Spectator_deb_Linux_${{ env.SHORT_SHA }}
          path: Spectator_deb_Linux_${{ env.SHORT_SHA }}.deb

  build-linux-rpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set short commit SHA
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            rpm

      - run: flutter pub get
      - run: flutter build linux --release --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}

      - name: Create .rpm package
        run: |
          mkdir -p ~/rpmbuild/{SPECS,BUILDROOT}
          RPM_ROOT=~/rpmbuild/BUILDROOT/spectator-1.0.0-1.x86_64

          mkdir -p "$RPM_ROOT/usr/local/bin"
          mkdir -p "$RPM_ROOT/usr/local/lib/spectator"
          mkdir -p "$RPM_ROOT/usr/share/applications"

          cp -r build/linux/x64/release/bundle/* "$RPM_ROOT/usr/local/lib/spectator/"

          cat > "$RPM_ROOT/usr/local/bin/spectator" << 'LAUNCHER'
          #!/bin/bash
          exec /usr/local/lib/spectator/spectator "$@"
          LAUNCHER
          chmod +x "$RPM_ROOT/usr/local/bin/spectator"

          cat > "$RPM_ROOT/usr/share/applications/spectator.desktop" << 'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Spectator
          Exec=/usr/local/bin/spectator
          Icon=spectator
          Categories=Utility;
          DESKTOP

          cat > ~/rpmbuild/SPECS/spectator.spec << 'SPEC'
          Name:    spectator
          Version: 1.0.0
          Release: 1
          Summary: Spectator application
          License: Proprietary
          AutoReqProv: no
          Requires: gtk3

          %description
          Spectator application

          %files
          /usr/local/bin/spectator
          /usr/local/lib/spectator
          /usr/share/applications/spectator.desktop
          SPEC

          rpmbuild -bb ~/rpmbuild/SPECS/spectator.spec
          cp ~/rpmbuild/RPMS/x86_64/spectator-*.rpm "./Spectator_rpm_Linux_${{ env.SHORT_SHA }}.rpm"

      - uses: actions/upload-artifact@v4
        with:
          name: Spectator_rpm_Linux_${{ env.SHORT_SHA }}
          path: Spectator_rpm_Linux_${{ env.SHORT_SHA }}.rpm

  build-linux-arch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set short commit SHA
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            zstd

      - run: flutter pub get
      - run: flutter build linux --release --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}

      - name: Create .pkg.tar.zst package
        run: |
          PKG_DIR=$(mktemp -d)
          mkdir -p "$PKG_DIR/usr/local/bin"
          mkdir -p "$PKG_DIR/usr/local/lib/spectator"
          mkdir -p "$PKG_DIR/usr/share/applications"

          cp -r build/linux/x64/release/bundle/* "$PKG_DIR/usr/local/lib/spectator/"

          cat > "$PKG_DIR/usr/local/bin/spectator" << 'LAUNCHER'
          #!/bin/bash
          exec /usr/local/lib/spectator/spectator "$@"
          LAUNCHER
          chmod +x "$PKG_DIR/usr/local/bin/spectator"

          cat > "$PKG_DIR/usr/share/applications/spectator.desktop" << 'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Spectator
          Exec=/usr/local/bin/spectator
          Icon=spectator
          Categories=Utility;
          DESKTOP

          cat > "$PKG_DIR/.PKGINFO" << 'PKGINFO'
          pkgname = spectator
          pkgver = 1.0.0-1
          pkgdesc = Spectator application
          url = https://github.com/spectator
          arch = x86_64
          depend = gtk3
          PKGINFO

          cd "$PKG_DIR"
          tar -cf - .PKGINFO usr | zstd -o "$GITHUB_WORKSPACE/Spectator_arch_Linux_${{ env.SHORT_SHA }}.pkg.tar.zst"

      - uses: actions/upload-artifact@v4
        with:
          name: Spectator_arch_Linux_${{ env.SHORT_SHA }}
          path: Spectator_arch_Linux_${{ env.SHORT_SHA }}.pkg.tar.zst

  # Windows
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set short commit SHA
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $env:GITHUB_ENV

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - run: flutter pub get
      - run: flutter build windows --release --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}

      - name: Package Windows build
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "Spectator_Windows_${{ env.SHORT_SHA }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Spectator_Windows_${{ env.SHORT_SHA }}
          path: Spectator_Windows_${{ env.SHORT_SHA }}.zip

  # macOS — DMG
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set short commit SHA
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - run: flutter pub get
      - run: flutter build macos --release --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}

      - name: Create DMG
        run: |
          APP_PATH="build/macos/Build/Products/Release/spectator.app"
          DMG_NAME="Spectator_macOS_${{ env.SHORT_SHA }}.dmg"

          DMG_DIR=$(mktemp -d)
          cp -r "$APP_PATH" "$DMG_DIR/"
          ln -s /Applications "$DMG_DIR/Applications"

          hdiutil create -volname "Spectator" \
            -srcfolder "$DMG_DIR" \
            -ov -format UDZO \
            "$DMG_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: Spectator_macOS_${{ env.SHORT_SHA }}
          path: Spectator_macOS_${{ env.SHORT_SHA }}.dmg

  # iOS — IPA (unsigned)
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set short commit SHA
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r "Spectator_iOS_${{ env.SHORT_SHA }}.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Spectator_iOS_${{ env.SHORT_SHA }}
          path: Spectator_iOS_${{ env.SHORT_SHA }}.ipa

  # Create GitHub Release with all artifacts
  release:
    runs-on: ubuntu-latest
    needs:
      - build-android
      - build-linux-deb
      - build-linux-rpm
      - build-linux-arch
      - build-windows
      - build-macos
      - build-ios
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set short commit SHA
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          CHANNEL="${{ github.event.inputs.channel }}"
          VERSION="${{ github.event.inputs.version }}"
          TAG="v${VERSION}-$(echo "$CHANNEL" | tr '[:upper:]' '[:lower:]')"

          # Find the previous release tag
          PREV_TAG=$(git tag --sort=-creatordate | head -n 1)

          # Determine commit range
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE=""
          fi

          # Build commit list with PR links
          COMMITS=""
          while IFS= read -r line; do
            HASH=$(echo "$line" | cut -d'|' -f1)
            MSG=$(echo "$line" | cut -d'|' -f2-)

            # Check if this commit is associated with a PR
            PR_NUMBER=$(gh api "repos/${REPO}/commits/${HASH}/pulls" --jq '.[0].number' 2>/dev/null || true)

            if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
              COMMITS="${COMMITS}\n- ${MSG} ([#${PR_NUMBER}](https://github.com/${REPO}/pull/${PR_NUMBER})) (${HASH})"
            else
              COMMITS="${COMMITS}\n- ${MSG} (${HASH})"
            fi
          done < <(git log $RANGE --pretty=format:"%h|%s" --no-merges)

          # Build contributors list
          CONTRIBUTORS=$(git log $RANGE --pretty=format:"%an" --no-merges | sort -u | sed 's/^/- /')

          printf "## Workflows: %s %s\n\n### Commits\n%b\n\n### Contributors\n%s\n" \
            "$CHANNEL" "$VERSION" "$COMMITS" "$CONTRIBUTORS" > release_notes.md

          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "RELEASE_NAME=Workflows: ${CHANNEL} ${VERSION}" >> $GITHUB_ENV

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Collect release files
        run: |
          mkdir -p release_files
          find artifacts/ -type f \( -name "*.apk" -o -name "*.deb" -o -name "*.rpm" -o -name "*.pkg.tar.zst" -o -name "*.zip" -o -name "*.dmg" -o -name "*.ipa" \) -exec cp {} release_files/ \;
          ls -la release_files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.RELEASE_NAME }}
          body_path: release_notes.md
          prerelease: true
          files: release_files/*
